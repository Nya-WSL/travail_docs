# 将 CNB 仓库变更自动同步至 GitHub 原仓库
# 使用 CNB 官方 git-sync 插件（tencentcom/git-sync）
#
# 前置条件：需要 GitHub 访问令牌（对目标仓库具备写权限）
# 已通过 CNB 密钥仓库 Nya-WSL/secret_travail_docs 的 env.yml 提供：
#   GIT_USERNAME: GitHub 用户名
#   GIT_PASSWORD: GitHub PAT（需 repo 写权限）
master:
  push:
    - name: sync to github
      imports:
        - https://cnb.cool/Nya-WSL/secret_travail_docs/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Nya-WSL/travail_docs.git
            auth_type: https
            username: "${GIT_USERNAME}"
            password: "${GIT_PASSWORD}"
            branch: master
