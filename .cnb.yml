# 将 CNB 仓库变更自动同步至 GitHub 原仓库
# 使用 CNB 官方 git-sync 插件（tencentcom/git-sync）
#
# 前置条件：需要 GitHub 访问令牌（对目标仓库具备写权限）
# 强烈建议将 GIT_USERNAME / GIT_PASSWORD 存入 CNB 密钥仓库，通过 imports 引用，
# 参考文档：https://docs.cnb.cool/zh/repo/secret.md
#
# 示例（在密钥仓库 env.yml 中配置 GIT_USERNAME 与 GIT_PASSWORD 后启用）：
#   imports:
#     - https://cnb.cool/Nya-WSL/<secret-repo>/-/blob/main/env.yml
master:
  push:
    - name: sync to github
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/Nya-WSL/travail_docs.git
            auth_type: https
            username: "${GIT_USERNAME}"
            password: "${GIT_PASSWORD}"
            branch: master
